# Pipeline configuration - the contract for one generation run.
# Relative paths are resolved against the project root (ADR-0010).

run:
  seed: 12345                 # master seed - drives all randomness (ADR-0006)

generation:
  reference_date: 2026-01-15  # simulated "today" for generated data (ADR-0003)
  history: "3y"               # how far back history extends (ADR-0012)

datasets:
  customer:
    records: 10000
  supplier:
    records: 3500               # generated BEFORE product (ADR-0014 order)
  product:
    records: 3000              # FK: supplier_id in 1..supplier.records
  employee:
    records: 200               # independent; FK target of order.sales_rep_employee_id
  order:
    records: 500000             # FK: customer_id, sales_rep_employee_id (ADR-0015/0016)
  order_item:
    records: 600000            # MUST be >= order.records (every order >= 1 item, ADR-0016)
  payment:
    records: 30000             # sampled from COMPLETED orders only; must not
                              # exceed their count (~70% of orders), ADR-0016
  review:
    records: 30000             # unique customer/product pairs from completed purchases

output:
  directory: data/generated   # resolved against project root (ADR-0010)
  format: csv
