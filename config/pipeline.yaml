# Pipeline configuration - the contract for one generation run.
# Relative paths are resolved against the project root (ADR-0010).

run:
  seed: 12345                 # master seed - drives all randomness (ADR-0006)

generation:
  reference_date: 2026-01-16 # simulated "today" for generated data (ADR-0003)
  history: "3y"               # how far back history extends (ADR-0012)

datasets:
  customer:
    records: 1000
  supplier:
    records: 50               # generated BEFORE product (ADR-0014 order)
  product:
    records: 300              # FK: supplier_id in 1..supplier.records
  employee:
    records: 20               # independent; FK target of order.sales_rep_employee_id
  order:
    records: 5000             # FK: customer_id, sales_rep_employee_id (ADR-0015/0016)
  order_item:
    records: 12000            # MUST be >= order.records (every order >= 1 item, ADR-0016)
  payment:
    records: 3000             # sampled from COMPLETED orders only (ADR-0016)
  review:
    records: 2000             # unique customer/product pairs from completed purchases

output:
  directory: data/generated   # resolved against project root (ADR-0010)
  format: csv

# Impurity engine (ADR-0021/0022/0023) - commented out = CLEAN runs.
# When active, output.directory MUST point at data/corrupted (guard in main.py).
# Fixed chain: null -> invalid_fk -> out_of_range -> drift -> duplicate.
# quality:
#   null_rate: 0.01           # one field nulled on a fraction of records
#   duplicate_rate: 0.02      # records re-emitted as exact delayed copies
#   invalid_fk_rate: 0.005    # records with an out-of-range FK
#   out_of_range_rate: 0.005  # numeric fields negated
#   drift_rate: 0.0           # records with dropped/extra columns
#   datasets:
#     customer:
#       null_fields: [phone, city]
#     order:
#       null_fields: [status]
#       invalid_fk_fields:    # FK field -> parent dataset (explicit mapping)
#         customer_id: customer
#         sales_rep_employee_id: employee
#     order_item:
#       out_of_range_fields: [quantity]
#     product:
#       drop_fields: [category]     # schema drift: missing column
