# Pipeline configuration - the contract for one generation run.
# Relative paths are resolved against the project root (ADR-0010).

run:
  seed: 12345                 # master seed - drives all randomness (ADR-0006)

generation:
  reference_date: 2026-01-15  # simulated "today" for generated data (ADR-0003)
  history: "3y"               # how far back history extends (ADR-0012)

datasets:
  customer:
    records: 1000
  supplier:
    records: 50               # generated BEFORE product (ADR-0014 order)
  product:
    records: 300              # FK: supplier_id in 1..supplier.records
  employee:
    records: 20               # independent; FK target of order.sales_rep_employee_id
  order:
    records: 5000             # FK: customer_id, sales_rep_employee_id (ADR-0015/0016)
  order_item:
    records: 12000            # MUST be >= order.records (every order >= 1 item, ADR-0016)
  payment:
    records: 3000             # sampled from COMPLETED orders only (ADR-0016)
  review:
    records: 2000             # unique customer/product pairs from completed purchases

output:
  directory: data/generated   # resolved against project root (ADR-0010)
  format: csv

# Impurity engine (ADR-0021/0022) - commented out = CLEAN runs (byte-identical).
# When active, output.directory MUST point at data/corrupted (guard in main.py).
# Rule chain order is fixed: null -> invalid_fk -> duplicate (ADR-0022).
# quality:
#   null_rate: 0.01           # fraction of records getting one field nulled
#   duplicate_rate: 0.02      # fraction of records re-emitted as exact copies
#   invalid_fk_rate: 0.005    # fraction of records with an out-of-range FK
#   datasets:
